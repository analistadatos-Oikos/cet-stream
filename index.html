<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Call CET Stream</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    .pbi-frame {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: none; display: block;
      transition: opacity 1.2s ease;
    }
    .pbi-frame.hidden  { opacity: 0; pointer-events: none; z-index: 1; }
    .pbi-frame.visible { opacity: 1; pointer-events: all;  z-index: 2; }

    #badge {
      position: fixed; bottom: 18px; right: 18px; z-index: 999;
      background: rgba(10,14,30,0.88); backdrop-filter: blur(10px);
      border: 1px solid rgba(92,107,192,0.35); border-radius: 10px;
      padding: 8px 14px; display: flex; align-items: center; gap: 9px;
      font-family: 'Segoe UI', sans-serif; font-size: 0.72rem;
      color: rgba(232,234,246,0.75); letter-spacing: 0.06em; user-select: none;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #4caf50;
      flex-shrink: 0; animation: pulse 1.4s ease infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(76,175,80,0.7); }
      70%  { box-shadow: 0 0 0 7px rgba(76,175,80,0); }
      100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); }
    }
    .ring-wrap { width: 22px; height: 22px; flex-shrink: 0; }
    .ring-wrap svg { transform: rotate(-90deg); }
    .ring-bg  { fill: none; stroke: rgba(92,107,192,0.2); stroke-width: 2.5; }
    .ring-arc {
      fill: none; stroke: #5c6bc0; stroke-width: 2.5; stroke-linecap: round;
      stroke-dasharray: 56.5; stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }
    /* Indicador de estado del swap */
    #swap-state {
      font-size: 0.6rem; color: rgba(232,234,246,0.35);
      min-width: 50px; text-align: right;
    }
  </style>
</head>
<body>

  <iframe id="frame-a" class="pbi-frame visible"
    src="https://app.powerbi.com/reportEmbed?reportId=bfdf7542-7321-4464-9de3-49d2a0e2256b&autoAuth=true&ctid=fe750c00-52ec-499e-969c-4d4c3900969f"
    allowfullscreen loading="eager"></iframe>

  <iframe id="frame-b" class="pbi-frame hidden"
    src="" allowfullscreen></iframe>

  <div id="badge">
    <div class="dot"></div>
    <span>LIVE</span>
    <div class="ring-wrap">
      <svg width="22" height="22" viewBox="0 0 22 22">
        <circle class="ring-bg" cx="11" cy="11" r="9"/>
        <circle class="ring-arc" cx="11" cy="11" r="9" id="ring-arc"/>
      </svg>
    </div>
    <span>Refresh en <span id="countdown-txt">60</span>s</span>
    <span id="swap-state"></span>
  </div>

  <script>
    const PBI_URL   = 'https://app.powerbi.com/reportEmbed?reportId=bfdf7542-7321-4464-9de3-49d2a0e2256b&autoAuth=true&ctid=fe750c00-52ec-499e-969c-4d4c3900969f';
    const INTERVAL  = 60;   // segundos entre cada swap
    const PRELOAD   = 20;   // segundos ANTES del swap para empezar a cargar el iframe fondo
    const WAIT_AFTER_LOAD = 8000; // ms extra después del onload antes de hacer swap

    const CIRCUMF   = 56.5;
    const frameA    = document.getElementById('frame-a');
    const frameB    = document.getElementById('frame-b');
    const arcEl     = document.getElementById('ring-arc');
    const countEl   = document.getElementById('countdown-txt');
    const stateEl   = document.getElementById('swap-state');

    let remaining   = INTERVAL;
    let active      = 'a';
    let swapping    = false;

    function updateRing(sec) {
      arcEl.style.strokeDashoffset = CIRCUMF * (1 - sec / INTERVAL);
      countEl.textContent = sec;
    }

    function swap() {
      if (swapping) return;
      swapping = true;

      const bgFrame   = active === 'a' ? frameB : frameA;
      const fgFrame   = active === 'a' ? frameA : frameB;

      stateEl.textContent = '⏳ cargando...';

      // Empieza a cargar el fondo
      bgFrame.src = PBI_URL;

      bgFrame.onload = () => {
        stateEl.textContent = '✓ listo';
        // Espera que PBI termine de renderizar antes de mostrar
        setTimeout(() => {
          bgFrame.classList.remove('hidden');
          bgFrame.classList.add('visible');
          fgFrame.classList.remove('visible');
          fgFrame.classList.add('hidden');

          active   = active === 'a' ? 'b' : 'a';
          swapping = false;
          stateEl.textContent = '';

          // Libera el iframe que quedó atrás
          setTimeout(() => { fgFrame.src = ''; }, 2000);
        }, WAIT_AFTER_LOAD);
      };
    }

    // Tick cada segundo
    updateRing(INTERVAL);
    setInterval(() => {
      remaining--;

      // Empieza a cargar el fondo con PRELOAD segundos de anticipación
      if (remaining === PRELOAD && !swapping) {
        const bgFrame = active === 'a' ? frameB : frameA;
        stateEl.textContent = '⏳ pre-cargando...';
        bgFrame.src = PBI_URL;
        bgFrame.onload = () => {
          stateEl.textContent = '✓ listo';
        };
      }

      if (remaining <= 0) {
        remaining = INTERVAL;
        updateRing(INTERVAL);
        // Si ya pre-cargó, solo hace el swap visual
        const bgFrame = active === 'a' ? frameB : frameA;
        const fgFrame = active === 'a' ? frameA : frameB;

        if (bgFrame.src && bgFrame.src !== window.location.href) {
          setTimeout(() => {
            bgFrame.classList.remove('hidden'); bgFrame.classList.add('visible');
            fgFrame.classList.remove('visible'); fgFrame.classList.add('hidden');
            active = active === 'a' ? 'b' : 'a';
            stateEl.textContent = '';
            setTimeout(() => { fgFrame.src = ''; }, 2000);
          }, 500);
        } else {
          swap(); // fallback si no pre-cargó
        }
      } else {
        updateRing(remaining);
      }
    }, 1000);
  </script>
</body>
</html>
