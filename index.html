<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Call CET Stream</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    .pbi {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: none;
      transition: opacity 1.5s ease;
    }
    #frame-a { z-index: 2; opacity: 1; }
    #frame-b { z-index: 1; opacity: 1; }

    /* Badge */
    #badge {
      position: fixed; bottom: 18px; right: 18px; z-index: 999;
      background: rgba(10,14,30,0.88); backdrop-filter: blur(10px);
      border: 1px solid rgba(92,107,192,0.35); border-radius: 10px;
      padding: 8px 14px; display: flex; align-items: center; gap: 9px;
      font-family: 'Segoe UI', sans-serif; font-size: 0.72rem;
      color: rgba(232,234,246,0.75); letter-spacing: 0.06em; user-select: none;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #4caf50;
      flex-shrink: 0; animation: pulse 1.4s ease infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(76,175,80,0.7); }
      70%  { box-shadow: 0 0 0 7px rgba(76,175,80,0); }
      100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); }
    }
    .ring-wrap { width: 22px; height: 22px; flex-shrink: 0; }
    .ring-wrap svg { transform: rotate(-90deg); }
    .ring-bg  { fill: none; stroke: rgba(92,107,192,0.2); stroke-width: 2.5; }
    .ring-arc {
      fill: none; stroke: #5c6bc0; stroke-width: 2.5; stroke-linecap: round;
      stroke-dasharray: 56.5; stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }
  </style>
</head>
<body>

  <!-- Ambos iframes SIEMPRE cargados -->
  <iframe id="frame-b" class="pbi"
    src="https://app.powerbi.com/reportEmbed?reportId=bfdf7542-7321-4464-9de3-49d2a0e2256b&autoAuth=true&ctid=fe750c00-52ec-499e-969c-4d4c3900969f"
    allowfullscreen></iframe>

  <iframe id="frame-a" class="pbi"
    src="https://app.powerbi.com/reportEmbed?reportId=bfdf7542-7321-4464-9de3-49d2a0e2256b&autoAuth=true&ctid=fe750c00-52ec-499e-969c-4d4c3900969f"
    allowfullscreen></iframe>

  <div id="badge">
    <div class="dot"></div>
    <span>LIVE</span>
    <div class="ring-wrap">
      <svg width="22" height="22" viewBox="0 0 22 22">
        <circle class="ring-bg" cx="11" cy="11" r="9"/>
        <circle class="ring-arc" cx="11" cy="11" r="9" id="ring-arc"/>
      </svg>
    </div>
    <span>Refresh en <span id="countdown-txt">30</span>s</span>
  </div>

  <script>
    const PBI_URL  = 'https://app.powerbi.com/reportEmbed?reportId=bfdf7542-7321-4464-9de3-49d2a0e2256b&autoAuth=true&ctid=fe750c00-52ec-499e-969c-4d4c3900969f';
    const INTERVAL = 30;
    const CIRCUMF  = 56.5;
    const RELOAD_DELAY = 25000; // recarga el iframe oculto 25s después del swap

    const fA      = document.getElementById('frame-a');
    const fB      = document.getElementById('frame-b');
    const arcEl   = document.getElementById('ring-arc');
    const countEl = document.getElementById('countdown-txt');
    let remaining = INTERVAL;
    let topIsA    = true; // frame-a empieza arriba (z-index 2, visible)

    function updateRing(sec) {
      arcEl.style.strokeDashoffset = CIRCUMF * (1 - sec / INTERVAL);
      countEl.textContent = sec;
    }

    function doSwap() {
      // El frame de abajo sube, el de arriba baja con fade
      if (topIsA) {
        fA.style.opacity = '0';          // A se desvanece
        fB.style.zIndex  = '2';          // B sube
        fA.style.zIndex  = '1';

        // Cuando A ya es invisible, recárgalo en background
        setTimeout(() => {
          fA.src = PBI_URL;              // recarga silenciosa
          fA.style.opacity = '1';        // lo devuelve opaco (invisible atrás)
        }, RELOAD_DELAY);

      } else {
        fB.style.opacity = '0';
        fA.style.zIndex  = '2';
        fB.style.zIndex  = '1';

        setTimeout(() => {
          fB.src = PBI_URL;
          fB.style.opacity = '1';
        }, RELOAD_DELAY);
      }

      topIsA = !topIsA;
    }

    updateRing(INTERVAL);
    setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        doSwap();
        remaining = INTERVAL;
        updateRing(INTERVAL);
      } else {
        updateRing(remaining);
      }
    }, 1000);
  </script>
</body>
</html>
